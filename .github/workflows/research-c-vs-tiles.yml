name: C exact tile-control PGO architecture duel
on:
  push:
    branches: ["research/c-breakthrough-20261101*"]
    paths: ["track-c/**", ".github/workflows/research-c-vs-tiles.yml"]
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Official full seed data, unprivileged output mount
        run: |
          sudo mkdir -p /data /out
          sudo chown "$(id -u):$(id -g)" /data /out
          python3 tests/oracle/generator.py --seed 1 --scale full --out /data
          chmod 777 /out
      - name: Rebuild exact immutable tile and candidate using identical pinned PGO
        run: |
          mkdir -p /tmp/c-tile-control
          git show a137469cf6ebd18bed7e4f61375c283798b55493:track-c/join.cpp > /tmp/c-tile-control/join.cpp
          cp track-c/Dockerfile track-c/generator.py /tmp/c-tile-control/
          sha256sum /tmp/c-tile-control/join.cpp track-c/join.cpp
          docker build --network=none -t c-tile /tmp/c-tile-control
          docker build --network=none -t c-candidate track-c
          for item in "c-tile baseline" "c-candidate current"; do
            set -- $item
            cid=$(docker create "$1")
            docker cp "$cid":/join "/tmp/sd-track-c-$2"
            docker rm "$cid"
          done
          mv /tmp/sd-track-c-current /tmp/sd-track-c
      - name: Exact alternating full-scale runtimes
        run: python3 tests/paired_benchmark.py
      - name: Complete fresh-container cgroup peaks
        run: python3 tests/paired_cgroup.py c-tile c-candidate
