name: Track C correctness and container
on:
  push:
    branches: [main, "frontier/round2-**", "frontier/c-**"]
    paths:
      - "track-c/**"
      - "tests/**"
      - ".github/workflows/track-c.yml"
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare data and output mounts
        run: |
          sudo mkdir -p /data /out
          sudo chown "$(id -u):$(id -g)" /data /out
      - name: Differential oracle, tiny/sample/full seeds
        run: python3 tests/test_track_c.py
      - name: Paired full-scale runtime and RSS comparison
        run: |
          git show f294a882897e2ceb940f8878306b30b80c5e9829:track-c/join.cpp > /tmp/sd-track-c-baseline.cpp
          g++ -O3 -march=x86-64-v3 -std=c++17 -DNDEBUG -flto -pthread -Wall -Wextra -Werror \
            -o /tmp/sd-track-c-baseline /tmp/sd-track-c-baseline.cpp
          wc -l /tmp/sd-track-c-baseline.cpp track-c/join.cpp
          if cmp -s /tmp/sd-track-c-baseline.cpp track-c/join.cpp; then
            echo "Source matches verified baseline; skip redundant paired timing"
          else
            python3 tests/paired_benchmark.py
          fi
      - name: Verify source-only x86-64-v3 compiler compatibility
        run: |
          g++ -O3 -march=x86-64-v3 -std=c++17 -DNDEBUG -flto -pthread -static -o /tmp/sd-track-c-default track-c/join.cpp
          python3 -c 'from pathlib import Path; Path("/out/aggregates.txt").unlink(missing_ok=True)'
          /tmp/sd-track-c-default
          test "$(sha256sum /out/aggregates.txt | cut -d' ' -f1)" = "d8088b1cd42ba1338b1345b107b55db7b96ef1f5066f3ff64fd26a8912a0f536"
      - name: Unscored phase profile and worker-count comparison
        run: python3 tests/profile_track_c.py
      - name: Build pinned offline Docker context
        run: docker build --network=none -t sd-track-c:ci track-c
      - name: Validate sandbox and full official hash
        run: |
          chmod 777 /out
          rm -f /out/aggregates.txt
          docker run --rm --network=none --read-only --memory=8g --cpus=4 \
            --user 65534:65534 -v /data:/data:ro -v /out:/out:rw sd-track-c:ci
          test "$(sha256sum /out/aggregates.txt | cut -d' ' -f1)" = \
            "d8088b1cd42ba1338b1345b107b55db7b96ef1f5066f3ff64fd26a8912a0f536"
          test "$(find /out -maxdepth 1 -type f | wc -l)" -eq 1
      - name: Extract the actual pinned release binary
        run: |
          container_id=$(docker create sd-track-c:ci)
          docker cp "$container_id":/join /tmp/sd-track-c
          docker rm "$container_id"
      - name: Paired production main release comparison
        run: |
          staging=$(mktemp -d)
          git show f294a882897e2ceb940f8878306b30b80c5e9829:track-c/join.cpp > "$staging/join.cpp"
          git show f294a882897e2ceb940f8878306b30b80c5e9829:track-c/Dockerfile > "$staging/Dockerfile"
          git show f294a882897e2ceb940f8878306b30b80c5e9829:track-c/generator.py > "$staging/generator.py"
          docker build --network=none -t sd-track-c:previous-pgo "$staging"
          container_id=$(docker create sd-track-c:previous-pgo)
          docker cp "$container_id":/join /tmp/sd-track-c-baseline
          docker rm "$container_id"
          python3 tests/paired_benchmark.py
      - name: Paired official BEST architecture comparison
        run: |
          staging=$(mktemp -d)
          git show 59e47be4236db4fc246673fec87e25bbd7231780:track-c/join.cpp > "$staging/join.cpp"
          git show 59e47be4236db4fc246673fec87e25bbd7231780:track-c/Dockerfile > "$staging/Dockerfile"
          git show 59e47be4236db4fc246673fec87e25bbd7231780:track-c/generator.py > "$staging/generator.py"
          docker build --network=none -t sd-track-c:official-best "$staging"
          container_id=$(docker create sd-track-c:official-best)
          docker cp "$container_id":/join /tmp/sd-track-c-baseline
          docker rm "$container_id"
          python3 tests/paired_benchmark.py
      - name: Paired qualified short-path PGO control
        run: |
          staging=$(mktemp -d)
          git show 90da5461b0c806fafd172ef2f5ca42feb9e0fff8:track-c/join.cpp > "$staging/join.cpp"
          git show 90da5461b0c806fafd172ef2f5ca42feb9e0fff8:track-c/Dockerfile > "$staging/Dockerfile"
          git show 90da5461b0c806fafd172ef2f5ca42feb9e0fff8:track-c/generator.py > "$staging/generator.py"
          docker build --network=none -t sd-track-c:short-control "$staging"
          container_id=$(docker create sd-track-c:short-control)
          docker cp "$container_id":/join /tmp/sd-track-c-baseline
          docker rm "$container_id"
          python3 tests/paired_benchmark.py
      - name: Paired actual qualified Frame PGO release
        run: |
          staging=$(mktemp -d)
          git show f0b0434:track-c/join.cpp > "$staging/join.cpp"
          git show f0b0434:track-c/Dockerfile > "$staging/Dockerfile"
          git show f0b0434:track-c/generator.py > "$staging/generator.py"
          docker build --network=none -t sd-track-c:frame-control "$staging"
          container_id=$(docker create sd-track-c:frame-control)
          docker cp "$container_id":/join /tmp/sd-track-c-baseline
          docker rm "$container_id"
          python3 tests/paired_benchmark.py
      - name: Paired restricted cgroup memory against Frame PGO control
        run: python3 tests/paired_cgroup.py sd-track-c:frame-control sd-track-c:ci
      - name: Independent full references for the final release binary
        if: hashFiles('track-c/generator.py') != ''
        run: python3 tests/check_binary_seeds.py --binary /tmp/sd-track-c --seeds 11 29
  sanitizers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        sanitizer: ["address,undefined", "thread"]
    steps:
      - uses: actions/checkout@v4
      - name: Prepare sandbox paths and sanitizer address space
        run: |
          sudo mkdir -p /data /out
          sudo chown "$(id -u):$(id -g)" /data /out
          sudo sysctl -w vm.mmap_rnd_bits=28
      - name: Independent references and hostile cases
        run: python3 tests/qualify_frontier.py --sanitizer='${{ matrix.sanitizer }}'
