name: Track C correctness and container
on:
  push:
    branches: [main]
    paths:
      - "track-c/**"
      - "tests/**"
      - ".github/workflows/track-c.yml"
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare data and output mounts
        run: |
          sudo mkdir -p /data /out
          sudo chown "$(id -u):$(id -g)" /data /out
      - name: Differential oracle, tiny/sample/full seeds
        run: python3 tests/test_track_c.py
      - name: Paired full-scale runtime and RSS comparison
        run: |
          git show 6984ee5313eca324ff22c0c4c6265abfe495bdda:track-c/join.cpp > /tmp/sd-track-c-baseline.cpp
          g++ -O3 -march=x86-64-v3 -std=c++17 -DNDEBUG -flto -pthread -Wall -Wextra -Werror \
            -o /tmp/sd-track-c-baseline /tmp/sd-track-c-baseline.cpp
          wc -l /tmp/sd-track-c-baseline.cpp track-c/join.cpp
          if cmp -s /tmp/sd-track-c-baseline.cpp track-c/join.cpp; then
            echo "Source matches verified baseline; skip redundant paired timing"
          else
            python3 tests/paired_benchmark.py
          fi
      - name: Unscored phase profile and worker-count comparison
        run: python3 tests/profile_track_c.py
      - name: Build pinned offline Docker context
        run: docker build --network=none -t sd-track-c:ci track-c
      - name: Validate sandbox and full official hash
        run: |
          chmod 777 /out
          rm -f /out/aggregates.txt
          docker run --rm --network=none --read-only --memory=8g --cpus=4 \
            --user 65534:65534 -v /data:/data:ro -v /out:/out:rw sd-track-c:ci
          test "$(sha256sum /out/aggregates.txt | cut -d' ' -f1)" = \
            "d8088b1cd42ba1338b1345b107b55db7b96ef1f5066f3ff64fd26a8912a0f536"
          test "$(find /out -maxdepth 1 -type f | wc -l)" -eq 1
